
name: equickly
description: "EQUICKLY - Futures Market Intelligence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  http: ^1.6.0
  html: ^0.15.7
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  marquee: ^2.3.0
  fl_chart: ^1.2.0
  intl: ^0.20.3

dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_perusahaan.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_perusahaan.png
    - assets/images/trading_background.png
